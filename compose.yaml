services:
  web:
    build: .
    env_file:
      - .env
    environment:
      # Connect between containers using the service name and internal database port.
      DATABASE_URL: postgresql://job_agent:job_agent_local@postgres:5432/job_agent
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent_local
      POSTGRES_DB: job_agent
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d job_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
