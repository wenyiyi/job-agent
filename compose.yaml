services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: job_agent
      POSTGRES_PASSWORD: job_agent_local
      POSTGRES_DB: job_agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U job_agent -d job_agent"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
